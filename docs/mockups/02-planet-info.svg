<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="-apple-system, 'Inter', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0a3e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060614" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(20,20,50,0.95)"/>
      <stop offset="100%" stop-color="rgba(13,13,42,0.95)"/>
    </linearGradient>
    <radialGradient id="earth" cx="32%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9fd4ff"/>
      <stop offset="50%" stop-color="#4fa4e8"/>
      <stop offset="100%" stop-color="#163e6c"/>
    </radialGradient>
    <linearGradient id="atmo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7eb6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7eb6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7eb6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="720" fill="url(#bg)"/>
  <!-- Star backdrop -->
  <g fill="white" opacity="0.4">
    <circle cx="60" cy="80" r="0.8"/>
    <circle cx="180" cy="50" r="1.0"/>
    <circle cx="280" cy="120" r="0.6"/>
    <circle cx="120" cy="220" r="0.9"/>
    <circle cx="240" cy="280" r="0.7"/>
    <circle cx="60" cy="380" r="0.8"/>
    <circle cx="700" cy="80" r="0.7"/>
    <circle cx="640" cy="180" r="1.0"/>
    <circle cx="740" cy="280" r="0.6"/>
    <circle cx="660" cy="380" r="0.8"/>
  </g>

  <!-- The planet info panel (positioned top-right of the scene) -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="360" height="680" rx="20" fill="url(#panel-bg)" stroke="rgba(255,255,255,0.18)"/>
    <!-- Scanline effect -->
    <line x1="20" y1="160" x2="340" y2="160" stroke="rgba(180,200,255,0.5)" stroke-width="1" opacity="0.4"/>

    <!-- Header -->
    <text x="22" y="40" fill="white" font-size="22" font-weight="700">Terra</text>
    <text x="22" y="58" fill="rgba(255,255,255,0.4)" font-size="11" letter-spacing="2.5">EARTH</text>
    <!-- Close button -->
    <rect x="304" y="20" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
    <text x="322" y="44" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="14">✕</text>

    <!-- Planet preview -->
    <g transform="translate(180, 130)">
      <circle cx="0" cy="0" r="50" fill="url(#earth)" filter="drop-shadow(0 0 24px rgba(79,164,232,0.4))"/>
      <!-- atmosphere ring -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="url(#atmo)" stroke-width="1.5" opacity="0.7"/>
      <!-- terminator (day/night) -->
      <circle cx="0" cy="0" r="50" fill="url(#night)" opacity="0.4"/>
      <defs>
        <radialGradient id="night" cx="65%" cy="35%" r="55%">
          <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="100%" stop-color="rgba(0,0,12,0.7)"/>
        </radialGradient>
      </defs>
    </g>

    <!-- Description -->
    <text x="22" y="220" fill="rgba(255,255,255,0.7)" font-size="12" font-style="italic">Il nostro pianeta, l'unico con vita conosciuta.</text>

    <!-- Stats table -->
    <g transform="translate(22, 250)" font-size="12">
      <g>
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Diametro</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">12.756 km</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 30)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Distanza dal Sole</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">149,6 mln km</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 60)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Periodo orbitale</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">365 giorni</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 90)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Rotazione (giorno)</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">23h 56m (siderale)</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 120)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Inclinazione assiale</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">23,44°</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 150)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Eccentricità orbita</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">0,0167</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 180)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Orbite in questa sessione</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500" font-family="'JetBrains Mono', monospace">2</text>
        <line x1="0" y1="22" x2="316" y2="22" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <g transform="translate(0, 210)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)">Satelliti mostrati (1 totali)</text>
        <text x="316" y="14" text-anchor="end" fill="white" font-weight="500">Luna</text>
      </g>
    </g>

    <!-- Section: Atmosphere -->
    <g transform="translate(22, 480)">
      <line x1="-22" y1="0" x2="338" y2="0" stroke="rgba(255,255,255,0.1)"/>
      <text x="0" y="20" fill="rgba(255,255,255,0.6)" font-size="11" font-weight="600" letter-spacing="1.5">▾ ATMOSFERA E CLIMA</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.75)" font-size="12">78% N₂, 21% O₂, 0,9% Ar</text>
      <text x="0" y="62" fill="rgba(255,255,255,0.6)" font-size="12">🌡️ 15 °C media superficiale</text>
    </g>

    <!-- Section: Missions -->
    <g transform="translate(22, 560)">
      <line x1="-22" y1="0" x2="338" y2="0" stroke="rgba(255,255,255,0.1)"/>
      <text x="0" y="20" fill="rgba(255,255,255,0.6)" font-size="11" font-weight="600" letter-spacing="1.5">▸ MISSIONI SPAZIALI</text>
    </g>
  </g>
</svg>
