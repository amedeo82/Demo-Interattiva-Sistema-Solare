<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, 'Inter', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0a3e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060614" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="frame-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#040410"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="50%" stop-color="#ffab2e"/>
      <stop offset="100%" stop-color="#d54a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="40" fill="white" font-size="22" font-weight="700">Architettura della scena 3D</text>
  <text x="40" y="64" fill="rgba(255,255,255,0.6)" font-size="13">Come sono composti i corpi celesti, dalla geometria agli shader.</text>

  <!-- =================== SOLE =================== -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="240" height="240" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#fcd34d" font-size="11" font-weight="600" letter-spacing="1.5">SOLE</text>
    <!-- 3 concentric layers -->
    <g transform="translate(120, 130)">
      <circle cx="0" cy="0" r="55" fill="url(#sun)" opacity="0.9"/>
      <circle cx="0" cy="0" r="65" fill="rgba(255,180,80,0.3)"/>
      <circle cx="0" cy="0" r="78" fill="rgba(255,150,40,0.18)"/>
      <circle cx="0" cy="0" r="90" fill="rgba(255,90,20,0.08)"/>
      <!-- sunspots -->
      <circle cx="-12" cy="6" r="3" fill="rgba(80,30,0,0.6)"/>
      <circle cx="10" cy="-14" r="2" fill="rgba(80,30,0,0.6)"/>
      <circle cx="20" cy="8" r="2.5" fill="rgba(80,30,0,0.6)"/>
    </g>
    <g transform="translate(0, 200)" font-size="10">
      <text x="14" y="0" fill="rgba(255,255,255,0.6)">• limb darkening</text>
      <text x="14" y="14" fill="rgba(255,255,255,0.6)">• plasma rotante</text>
      <text x="14" y="28" fill="rgba(255,255,255,0.6)">• doppia corona animata</text>
    </g>
  </g>

  <!-- =================== PIANETA TIPO TERRA =================== -->
  <g transform="translate(360, 130)">
    <rect x="0" y="0" width="240" height="240" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#7eb6ff" font-size="11" font-weight="600" letter-spacing="1.5">PIANETA (es. Terra)</text>
    <g transform="translate(120, 130)">
      <!-- Albedo (map) -->
      <circle cx="0" cy="0" r="56" fill="#1c5f9e" stroke="rgba(255,255,255,0.3)"/>
      <ellipse cx="-12" cy="-8" rx="14" ry="9" fill="#3f7d3a"/>
      <ellipse cx="18" cy="14" rx="10" ry="6" fill="#5d9b52"/>
      <ellipse cx="-20" cy="20" rx="6" ry="3" fill="rgba(255,255,255,0.8)"/>
      <!-- Bump (overlay) - small dots -->
      <g fill="rgba(255,255,255,0.25)" opacity="0.6">
        <circle cx="-5" cy="-20" r="1.5"/>
        <circle cx="25" cy="-5" r="1"/>
        <circle cx="15" cy="25" r="1.2"/>
        <circle cx="-25" cy="0" r="1.3"/>
        <circle cx="-15" cy="-18" r="1.1"/>
      </g>
      <!-- Atmosphere Fresnel (outer ring) -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#7eb6ff" stroke-width="1.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="64" fill="none" stroke="#7eb6ff" stroke-width="0.8" opacity="0.3"/>
      <!-- Terminator (shadow) -->
      <path d="M 0 -56 A 56 56 0 0 1 0 56 A 30 56 0 0 0 0 -56 Z" fill="rgba(0,0,12,0.6)"/>
      <!-- Specular -->
      <circle cx="-25" cy="-25" r="8" fill="rgba(255,250,235,0.4)"/>
    </g>
    <g transform="translate(0, 200)" font-size="10">
      <text x="14" y="0" fill="rgba(255,255,255,0.6)">• albedo (NASA 2K)</text>
      <text x="14" y="14" fill="rgba(255,255,255,0.6)">• bump map (crateri/rilievo)</text>
      <text x="14" y="28" fill="rgba(255,255,255,0.6)">• atmosfera Fresnel (BackSide)</text>
    </g>
  </g>

  <!-- =================== SATURNO =================== -->
  <g transform="translate(660, 130)">
    <rect x="0" y="0" width="240" height="240" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#e8d088" font-size="11" font-weight="600" letter-spacing="1.5">SATURNO (anelli)</text>
    <g transform="translate(120, 130)">
      <ellipse cx="0" cy="0" rx="100" ry="30" fill="none" stroke="rgba(232,208,136,0.55)" stroke-width="1.5" transform="rotate(-18)"/>
      <ellipse cx="0" cy="0" rx="88" ry="22" fill="none" stroke="rgba(232,208,136,0.4)" stroke-width="1" transform="rotate(-18)"/>
      <ellipse cx="0" cy="0" rx="76" ry="16" fill="none" stroke="rgba(232,208,136,0.3)" stroke-width="0.8" transform="rotate(-18)"/>
      <ellipse cx="0" cy="0" rx="50" ry="40" fill="#e8d088"/>
      <!-- Shadow on planet (from rings) -->
      <rect x="-50" y="-3" width="100" height="6" fill="rgba(0,0,0,0.5)" opacity="0.5"/>
      <!-- Shadow on rings (from planet) - linear gradient on one half -->
      <path d="M -100 0 A 100 30 0 0 0 -80 -10 L 80 -10 A 100 30 0 0 1 100 0 Z" fill="rgba(0,0,0,0.4)" transform="rotate(-18)"/>
    </g>
    <g transform="translate(0, 200)" font-size="10">
      <text x="14" y="0" fill="rgba(255,255,255,0.6)">• anelli procedurali</text>
      <text x="14" y="14" fill="rgba(255,255,255,0.6)">• ombra anelli→pianeta</text>
      <text x="14" y="28" fill="rgba(255,255,255,0.6)">• ombra pianeta→anelli</text>
    </g>
  </g>

  <!-- =================== ASTEROIDI =================== -->
  <g transform="translate(960, 130)">
    <rect x="0" y="0" width="200" height="240" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#b9a58c" font-size="11" font-weight="600" letter-spacing="1.5">FASCIA ASTEROIDI</text>
    <g transform="translate(100, 130)">
      <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3"/>
      <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 3"/>
      <g fill="#b9a58c">
        <circle cx="60" cy="-40" r="1.5" opacity="0.7"/>
        <circle cx="40" cy="60" r="2" opacity="0.6"/>
        <circle cx="-50" cy="50" r="1.2" opacity="0.8"/>
        <circle cx="-30" cy="-65" r="1.8" opacity="0.5"/>
        <circle cx="20" cy="-70" r="1.3" opacity="0.6"/>
        <circle cx="70" cy="20" r="1.6" opacity="0.7"/>
        <circle cx="-65" cy="-20" r="1.4" opacity="0.5"/>
        <circle cx="50" cy="50" r="1.1" opacity="0.6"/>
        <circle cx="-45" cy="-40" r="1.3" opacity="0.7"/>
        <circle cx="0" cy="75" r="1.5" opacity="0.5"/>
        <circle cx="75" cy="-15" r="1.2" opacity="0.6"/>
        <circle cx="-15" cy="60" r="1.4" opacity="0.7"/>
      </g>
    </g>
    <g transform="translate(0, 200)" font-size="10">
      <text x="14" y="0" fill="rgba(255,255,255,0.6)">• ~350 THREE.Points</text>
      <text x="14" y="14" fill="rgba(255,255,255,0.6)">• 3ª legge Keplero</text>
      <text x="14" y="28" fill="rgba(255,255,255,0.6)">• rotazione + tilt</text>
    </g>
  </g>

  <!-- =================== TIMELINE & SCIE =================== -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="500" height="120" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#a855f7" font-size="11" font-weight="600" letter-spacing="1.5">TIMELINE + SCIE</text>
    <!-- Timeline -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="460" height="24" rx="6" fill="rgba(13,13,42,0.7)" stroke="rgba(255,255,255,0.1)"/>
      <text x="6" y="16" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="9">-2y</text>
      <text x="438" y="16" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="9">+2y</text>
      <rect x="32" y="9" width="396" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <linearGradient id="tlf" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <rect x="280" y="9" width="148" height="6" rx="3" fill="url(#tlf)"/>
      <circle cx="280" cy="12" r="6" fill="white" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
    </g>
    <text x="20" y="84" fill="rgba(255,255,255,0.6)" font-size="11">Scrub ±2 anni · drag/touch/keyboard · pausa automatica durante drag</text>
    <text x="20" y="104" fill="rgba(196,181,253,0.8)" font-size="10">Scie orbitali: 96 punti kepleriani dietro al pianeta selezionato, vertex colors sfumati</text>
  </g>

  <!-- =================== CONGIUNZIONI =================== -->
  <g transform="translate(600, 400)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#a855f7" font-size="11" font-weight="600" letter-spacing="1.5">CONGIUNZIONI</text>
    <g transform="translate(60, 70)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#e8cda0"/>
      <text x="0" y="38" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Venere</text>
    </g>
    <g transform="translate(160, 70)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#a855f7" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#4fa4e8"/>
      <text x="0" y="38" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Terra</text>
    </g>
    <line x1="68" y1="70" x2="152" y2="70" stroke="#a855f7" stroke-width="0.6" stroke-dasharray="2 4" opacity="0.4"/>
    <text x="140" y="106" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">5°/3° isteresi · banner DOM</text>
  </g>

  <!-- =================== PWA =================== -->
  <g transform="translate(920, 400)">
    <rect x="0" y="0" width="240" height="120" rx="16" fill="url(#frame-bg)" stroke="rgba(255,255,255,0.15)"/>
    <text x="14" y="22" fill="#7de8e8" font-size="11" font-weight="600" letter-spacing="1.5">PWA · AUDIO</text>
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="48" height="48" rx="10" fill="rgba(125,232,232,0.15)" stroke="rgba(125,232,232,0.4)"/>
      <text x="24" y="32" text-anchor="middle" font-size="22">📱</text>
      <text x="24" y="68" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">manifest + sw</text>
    </g>
    <g transform="translate(120, 60)">
      <rect x="0" y="0" width="48" height="48" rx="10" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)"/>
      <text x="24" y="32" text-anchor="middle" font-size="22">🔊</text>
      <text x="24" y="68" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="9">Web Audio drone</text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="40" y="660" fill="rgba(255,255,255,0.4)" font-size="11">Stack: React 18 · TypeScript · Vite · Three.js (react-three-fiber) · @react-three/drei · postprocessing · Tailwind 4 · Zustand</text>
</svg>
