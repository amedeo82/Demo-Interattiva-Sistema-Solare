<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" font-family="-apple-system, 'Inter', system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#10102b"/>
      <stop offset="100%" stop-color="#060614"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0"/>
      <stop offset="50%" stop-color="#ffab2e"/>
      <stop offset="100%" stop-color="#d54a00"/>
    </radialGradient>
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d2a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a0a3e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="10" y="10" width="400" height="840" rx="40" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Notch -->
  <rect x="160" y="20" width="100" height="22" rx="11" fill="#000"/>

  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="80" cy="120" r="0.7"/>
    <circle cx="200" cy="80" r="0.9"/>
    <circle cx="320" cy="140" r="0.6"/>
    <circle cx="60" cy="240" r="0.8"/>
    <circle cx="360" cy="280" r="0.7"/>
    <circle cx="120" cy="380" r="0.5"/>
    <circle cx="340" cy="400" r="0.9"/>
    <circle cx="80" cy="500" r="0.6"/>
    <circle cx="350" cy="540" r="0.7"/>
    <circle cx="180" cy="620" r="0.8"/>
  </g>

  <!-- Header -->
  <rect x="10" y="42" width="400" height="56" fill="url(#header-bg)"/>
  <text x="32" y="76" fill="white" font-size="14" font-weight="700">🌌 Sistema Solare</text>
  <g transform="translate(280, 56)">
    <rect x="0" y="0" width="44" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="22" y="19" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">Etichette</text>
    <rect x="52" y="0" width="48" height="28" rx="6" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.7)"/>
    <text x="76" y="19" text-anchor="middle" fill="#e9d5ff" font-size="10">Realismo</text>
  </g>

  <!-- Timeline -->
  <g transform="translate(10, 98)">
    <rect x="12" y="0" width="376" height="36" rx="8" fill="rgba(13,13,42,0.7)" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="22" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="9">-2y</text>
    <text x="358" y="22" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono', monospace" font-size="9">+2y</text>
    <rect x="48" y="14" width="300" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="200" y="14" width="148" height="6" rx="3" fill="url(#timeline-fill)"/>
    <circle cx="200" cy="17" r="7" fill="white" stroke="rgba(255,255,255,0.85)" stroke-width="1.5" style="filter: drop-shadow(0 0 4px rgba(168,85,247,0.7));"/>
    <linearGradient id="timeline-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </g>

  <!-- Solar system scene -->
  <g transform="translate(210, 380)">
    <!-- Orbits -->
    <g fill="none" stroke="rgba(255,255,255,0.09)">
      <ellipse cx="0" cy="0" rx="50" ry="50"/>
      <ellipse cx="0" cy="0" rx="75" ry="75"/>
      <ellipse cx="0" cy="0" rx="105" ry="105"/>
      <ellipse cx="0" cy="0" rx="135" ry="135"/>
      <ellipse cx="0" cy="0" rx="175" ry="175"/>
    </g>
    <!-- Sun -->
    <circle cx="0" cy="0" r="22" fill="url(#sun)"/>
    <circle cx="0" cy="0" r="40" fill="url(#sun)" opacity="0.4"/>
    <!-- Planets -->
    <circle cx="35" cy="-32" r="3" fill="#b5b5b5"/>
    <text x="35" y="-44" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="7">Mercurio</text>
    <circle cx="-66" cy="40" r="4" fill="#e8cda0"/>
    <text x="-66" y="55" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="7">Venere</text>
    <circle cx="0" cy="-105" r="4.5" fill="#4fa4e8" stroke="rgba(255,255,255,0.9)" stroke-width="1.2"/>
    <text x="0" y="-118" text-anchor="middle" fill="white" font-size="8" font-weight="600">Terra</text>
    <circle cx="110" cy="80" r="4" fill="#e07040"/>
    <text x="110" y="95" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="7">Marte</text>
    <circle cx="-150" cy="100" r="9" fill="#c8a060"/>
    <text x="-150" y="120" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="7">Giove</text>
  </g>

  <!-- Bottom controls -->
  <g transform="translate(10, 660)">
    <rect x="0" y="0" width="400" height="190" fill="rgba(13,13,42,0.85)" stroke="rgba(255,255,255,0.1)"/>
    <!-- Play + speed -->
    <rect x="14" y="14" width="120" height="40" rx="10" fill="rgba(34,197,94,0.28)" stroke="rgba(34,197,94,0.45)"/>
    <text x="74" y="38" text-anchor="middle" fill="#86efac" font-size="13" font-weight="600">▶ Riproduci</text>
    <text x="148" y="32" fill="rgba(255,255,255,0.5)" font-size="10">VELOCITÀ</text>
    <text x="148" y="48" fill="white" font-size="13" font-weight="700">1x</text>
    <g font-size="10">
      <rect x="220" y="18" width="36" height="28" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
      <text x="238" y="36" text-anchor="middle" fill="rgba(255,255,255,0.7)">0.5x</text>
      <rect x="260" y="18" width="36" height="28" rx="5" fill="rgba(168,85,247,0.3)" stroke="rgba(168,85,247,0.7)"/>
      <text x="278" y="36" text-anchor="middle" fill="#e9d5ff">1x</text>
      <rect x="300" y="18" width="36" height="28" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
      <text x="318" y="36" text-anchor="middle" fill="rgba(255,255,255,0.7)">2x</text>
      <rect x="340" y="18" width="36" height="28" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
      <text x="358" y="36" text-anchor="middle" fill="rgba(255,255,255,0.7)">5x</text>
    </g>
    <!-- Pianeti -->
    <text x="14" y="80" fill="rgba(255,255,255,0.6)" font-size="10" font-weight="600" letter-spacing="1.2">PIANETI</text>
    <g font-size="12">
      <rect x="14" y="90" width="372" height="32" rx="6" fill="transparent"/>
      <circle cx="30" cy="106" r="5" fill="#b5b5b5"/>
      <text x="44" y="110" fill="rgba(255,255,255,0.8)">Mercurio</text>
      <text x="370" y="110" text-anchor="end" fill="rgba(255,255,255,0.3)">☿</text>
      <rect x="14" y="124" width="372" height="32" rx="6" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.7)"/>
      <circle cx="30" cy="140" r="5" fill="#4fa4e8"/>
      <text x="44" y="144" fill="white" font-weight="600">Terra</text>
      <text x="370" y="144" text-anchor="end" fill="rgba(255,255,255,0.3)">♁</text>
      <rect x="14" y="158" width="372" height="32" rx="6" fill="transparent"/>
      <circle cx="30" cy="174" r="5" fill="#e07040"/>
      <text x="44" y="178" fill="rgba(255,255,255,0.8)">Marte</text>
      <text x="370" y="178" text-anchor="end" fill="rgba(255,255,255,0.3)">♂</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="170" y="820" width="80" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
</svg>
