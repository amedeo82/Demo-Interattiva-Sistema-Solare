<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="-apple-system, 'Inter', system-ui, sans-serif">
  <defs>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(20,20,50,0.96)"/>
      <stop offset="100%" stop-color="rgba(13,13,42,0.96)"/>
    </linearGradient>
    <radialGradient id="earth" cx="32%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9fd4ff"/>
      <stop offset="50%" stop-color="#4fa4e8"/>
      <stop offset="100%" stop-color="#163e6c"/>
    </radialGradient>
    <radialGradient id="jupiter" cx="32%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0d8a0"/>
      <stop offset="50%" stop-color="#c89858"/>
      <stop offset="100%" stop-color="#5a3818"/>
    </radialGradient>
  </defs>
  <rect width="800" height="540" fill="rgba(0,0,0,0.85)"/>

  <!-- Modal panel -->
  <g transform="translate(120, 30)">
    <rect x="0" y="0" width="560" height="480" rx="20" fill="url(#panel-bg)" stroke="rgba(255,255,255,0.18)"/>
    <!-- Header -->
    <text x="22" y="40" fill="white" font-size="18" font-weight="700">⚖️ Confronto pianeti</text>
    <rect x="504" y="18" width="36" height="36" rx="8" fill="rgba(255,255,255,0.05)"/>
    <text x="522" y="42" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="14">✕</text>

    <!-- Selectors -->
    <g transform="translate(22, 70)">
      <text x="0" y="12" fill="rgba(255,255,255,0.6)" font-size="11">Pianeta A</text>
      <rect x="0" y="20" width="240" height="34" rx="10" fill="#141433" stroke="rgba(255,255,255,0.15)"/>
      <circle cx="20" cy="37" r="6" fill="url(#earth)"/>
      <text x="36" y="42" fill="white" font-size="13">Terra</text>
    </g>
    <g transform="translate(298, 70)">
      <text x="0" y="12" fill="rgba(255,255,255,0.6)" font-size="11">Pianeta B</text>
      <rect x="0" y="20" width="240" height="34" rx="10" fill="#141433" stroke="rgba(255,255,255,0.15)"/>
      <circle cx="20" cy="37" r="6" fill="url(#jupiter)"/>
      <text x="36" y="42" fill="white" font-size="13">Giove</text>
    </g>

    <!-- Comparison table -->
    <g transform="translate(22, 140)" font-size="13">
      <!-- Header row -->
      <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11" font-weight="500"></text>
      <g transform="translate(160, 0)">
        <circle cx="0" cy="10" r="6" fill="url(#earth)"/>
        <text x="12" y="14" fill="white" font-size="12" font-weight="600">Terra</text>
      </g>
      <g transform="translate(360, 0)">
        <circle cx="0" cy="10" r="6" fill="url(#jupiter)"/>
        <text x="12" y="14" fill="white" font-size="12" font-weight="600">Giove</text>
      </g>

      <!-- Rows -->
      <g transform="translate(0, 36)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11">Diametro</text>
        <text x="170" y="14" fill="rgba(255,255,255,0.8)" font-family="'JetBrains Mono', monospace">12.756 km</text>
        <text x="370" y="14" fill="#86efac" font-family="'JetBrains Mono', monospace">142.984 km</text>
        <line x1="0" y1="28" x2="500" y2="28" stroke="rgba(255,255,255,0.1)"/>
      </g>
      <g transform="translate(0, 70)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11">Distanza dal Sole</text>
        <text x="170" y="14" fill="#86efac" font-family="'JetBrains Mono', monospace">149,6 mln km</text>
        <text x="370" y="14" fill="rgba(255,255,255,0.8)" font-family="'JetBrains Mono', monospace">778,6 mln km</text>
        <line x1="0" y1="28" x2="500" y2="28" stroke="rgba(255,255,255,0.1)"/>
      </g>
      <g transform="translate(0, 104)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11">Anno planetario</text>
        <text x="170" y="14" fill="#86efac" font-family="'JetBrains Mono', monospace">365 giorni</text>
        <text x="370" y="14" fill="rgba(255,255,255,0.8)" font-family="'JetBrains Mono', monospace">11,86 anni</text>
        <line x1="0" y1="28" x2="500" y2="28" stroke="rgba(255,255,255,0.1)"/>
      </g>
      <g transform="translate(0, 138)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11">Satelliti</text>
        <text x="170" y="14" fill="rgba(255,255,255,0.8)" font-family="'JetBrains Mono', monospace">1</text>
        <text x="370" y="14" fill="#86efac" font-family="'JetBrains Mono', monospace">95</text>
        <line x1="0" y1="28" x2="500" y2="28" stroke="rgba(255,255,255,0.1)"/>
      </g>
      <g transform="translate(0, 172)">
        <text x="0" y="14" fill="rgba(255,255,255,0.5)" font-size="11">Rapporto dimensioni</text>
        <text x="0" y="40" fill="rgba(255,255,255,0.8)">Giove è <tspan font-weight="700">11,2×</tspan> più grande della Terra</text>
      </g>
    </g>
    <text x="280" y="450" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10">In verde il valore maggiore per ogni metrica.</text>
  </g>
</svg>
